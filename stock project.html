<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense AI | Lasso Regression Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #080d19; color: #edf4ff; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
    .display { font-family: Georgia, "Times New Roman", serif; letter-spacing: -0.03em; }
    .grid-bg { background-image: linear-gradient(rgba(57, 85, 130, .09) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 85, 130, .09) 1px, transparent 1px); background-size: 42px 42px; }
    .glow { box-shadow: 0 0 80px rgba(59, 130, 246, .15); }
    .card { background: rgba(17, 24, 39, .78); border: 1px solid rgba(148, 163, 184, .13); box-shadow: 0 18px 50px rgba(0,0,0,.2); backdrop-filter: blur(16px); }
    .reveal { animation: rise .65s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .chart-wrap { position: relative; height: 320px; }
    @media (max-width: 640px) { .chart-wrap { height: 240px; } }
    input, select { color: #edf4ff; background: #0d1525; border: 1px solid #293854; }
    input:focus, select:focus { outline: 2px solid rgba(59,130,246,.6); outline-offset: 1px; }
    .metric-value { font-variant-numeric: tabular-nums; }
    @media print { nav, .no-print, button, .hero-actions { display: none !important; } body { background: white; color: #111827; } .card { box-shadow: none; background: white; color: #111827; border: 1px solid #ddd; } section { break-inside: avoid; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useRef, useState } = React;
    const money = value => `$${Number(value || 0).toFixed(2)}`;
    const pct = value => `${Number(value || 0) >= 0 ? '+' : ''}${Number(value || 0).toFixed(2)}%`;

    function ChartCanvas({ type, data, options }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ref.current || !data) return;
        const chart = new ChartJS(ref.current, { type, data, options });
        return () => chart.destroy();
      }, [type, data, options]);
      return <canvas ref={ref} />;
    }

    const ChartJS = window.Chart;
    const Chart = ChartCanvas;
    const chartOptions = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { labels: { color: '#a9b8d0', usePointStyle: true, padding: 18 } }, tooltip: { backgroundColor: '#101a2e', borderColor: '#31476d', borderWidth: 1, padding: 12 } }, scales: { x: { ticks: { color: '#7183a0', maxTicksLimit: 7 }, grid: { color: 'rgba(148,163,184,.08)' } }, y: { ticks: { color: '#7183a0', callback: value => '$' + value }, grid: { color: 'rgba(148,163,184,.08)' } } } };

    function Nav({ onRun }) {
      const [open, setOpen] = useState(false);
      return <nav className="fixed z-50 top-0 w-full border-b border-slate-800/80 bg-[#080d19]/85 backdrop-blur-xl">
        <div className="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">
          <a href="#home" className="flex items-center gap-3"><span className="w-9 h-9 rounded-xl bg-blue-500/15 border border-blue-400/30 flex items-center justify-center text-blue-300 font-bold">S</span><span className="font-bold tracking-tight">StockSense <span className="text-blue-400">AI</span></span></a>
          <button className="md:hidden text-slate-300 text-xl" onClick={() => setOpen(!open)} aria-label="Toggle menu">=</button>
          <div className={`${open ? 'flex' : 'hidden'} md:flex absolute md:static top-full left-0 right-0 p-5 md:p-0 bg-[#080d19] md:bg-transparent flex-col md:flex-row items-start md:items-center gap-5 text-sm text-slate-300`}>
            <a href="#home" onClick={() => setOpen(false)}>Home</a><a href="#prediction" onClick={() => setOpen(false)}>Prediction</a><a href="#model" onClick={() => setOpen(false)}>Model</a><a href="#about" onClick={() => setOpen(false)}>About</a>
            <button onClick={onRun} className="rounded-lg bg-blue-500 px-4 py-2 text-white font-bold hover:bg-blue-400 transition">Open lab</button>
          </div>
        </div>
      </nav>;
    }

    function Stat({ label, value, note, tone = 'text-white' }) { return <div className="card rounded-2xl p-5"><p className="text-xs uppercase tracking-widest text-slate-500">{label}</p><p className={`metric-value mt-2 text-2xl font-bold ${tone}`}>{value}</p>{note && <p className="text-xs text-slate-500 mt-2">{note}</p>}</div>; }
    function SectionTitle({ eyebrow, title, copy }) { return <div className="mb-8"><p className="text-xs uppercase tracking-[.22em] text-blue-400 font-bold">{eyebrow}</p><h2 className="display text-3xl md:text-4xl mt-3">{title}</h2>{copy && <p className="text-slate-400 mt-3 max-w-2xl leading-7">{copy}</p>}</div>; }

    function App() {
      const [symbol, setSymbol] = useState('AAPL');
      const [years, setYears] = useState(3);
      const [horizon, setHorizon] = useState(5);
      const [alpha, setAlpha] = useState(.35);
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [field, setField] = useState('close');
      const [range, setRange] = useState(90);
      const runRef = useRef(null);

      const runPrediction = async () => {
        setLoading(true); setError('');
        try {
          const response = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbol, years, horizon, alpha }) });
          if (!response.ok) throw new Error('The model could not complete this run.');
          setData(await response.json());
        } catch (err) { setError(err.message); } finally { setLoading(false); }
      };
      useEffect(() => { runPrediction(); }, []);
      useEffect(() => { if (data) runPrediction(); }, [alpha]);
      const scrollRun = () => runRef.current?.scrollIntoView({ behavior: 'smooth' });
      const visibleHistory = data?.history?.slice(-range) || [];
      const historyChart = data && { labels: visibleHistory.map(row => row.date), datasets: [{ label: field.replace('_', ' ').replace(/\b\w/g, char => char.toUpperCase()), data: visibleHistory.map(row => row[field]), borderColor: '#60a5fa', backgroundColor: 'rgba(59,130,246,.12)', fill: true, tension: .28, pointRadius: 0, borderWidth: 2 }] };
      const comparisonChart = data && { labels: data.actual_predicted.map(row => row.date), datasets: [{ label: 'Actual price', data: data.actual_predicted.map(row => row.actual), borderColor: '#22c55e', pointRadius: 0, tension: .25, borderWidth: 2 }, { label: 'Lasso predicted', data: data.actual_predicted.map(row => row.predicted), borderColor: '#a78bfa', pointRadius: 0, tension: .25, borderWidth: 2 }] };
      const coefficientChart = data && { labels: data.coefficients.map(row => row.label), datasets: [{ label: 'Coefficient', data: data.coefficients.map(row => row.value), backgroundColor: data.coefficients.map(row => row.removed ? 'rgba(245,158,11,.55)' : 'rgba(96,165,250,.72)'), borderRadius: 5 }] };

      return <>
        <Nav onRun={scrollRun} />
        <main>
          <section id="home" className="grid-bg pt-32 pb-20 px-5 relative overflow-hidden"><div className="max-w-7xl mx-auto grid lg:grid-cols-[1.05fr_.95fr] gap-14 items-center"><div className="reveal"><div className="inline-flex items-center gap-2 rounded-full border border-blue-400/25 bg-blue-400/10 px-3 py-1.5 text-xs text-blue-300"><span className="w-2 h-2 rounded-full bg-green-400"></span> Educational model lab · Demo data</div><h1 className="display text-6xl md:text-8xl mt-7 leading-[.92]">See the signal<br /><span className="text-blue-400">behind the price.</span></h1><p className="mt-7 text-lg leading-8 text-slate-400 max-w-xl">Analyze historical market data, identify influential features, and generate educational stock-price predictions using Lasso Regression.</p><div className="hero-actions flex flex-wrap gap-3 mt-9"><button onClick={scrollRun} className="rounded-xl bg-blue-500 px-6 py-3.5 font-bold hover:bg-blue-400 transition">Start prediction <span className="ml-2">-&gt;</span></button><a href="#how" className="rounded-xl border border-slate-700 px-6 py-3.5 font-bold text-slate-200 hover:border-slate-500 transition">How it works</a></div></div><div className="card glow rounded-3xl p-5 md:p-7 reveal" style={{animationDelay: '.12s'}}><div className="flex justify-between items-center mb-6"><div><p className="text-xs uppercase tracking-widest text-slate-500">Live model preview</p><p className="text-2xl font-bold mt-1">{data?.symbol || 'AAPL'} signal</p></div><span className="text-xs text-green-300 bg-green-400/10 border border-green-400/20 px-2 py-1 rounded-full">● Ready</span></div><div className="chart-wrap h-64"><ChartCanvas type="line" data={historyChart || { labels: [], datasets: [] }} options={chartOptions} /></div><div className="grid grid-cols-3 gap-3 mt-5"><div><p className="text-xs text-slate-500">Latest</p><p className="font-bold">{money(data?.latest)}</p></div><div><p className="text-xs text-slate-500">Estimate</p><p className="font-bold text-blue-300">{money(data?.predicted)}</p></div><div><p className="text-xs text-slate-500">Features kept</p><p className="font-bold">{data?.selected_features || '--'}/12</p></div></div></div></div></section>

          <section id="prediction" ref={runRef} className="max-w-7xl mx-auto px-5 py-20"><SectionTitle eyebrow="01 / Prediction lab" title="Configure your experiment" copy="Choose a demo ticker, time horizon, and regularization strength. Every run uses a chronological train/test split to respect the order of market data." /><div className="card rounded-3xl p-5 md:p-7"><div className="grid md:grid-cols-2 lg:grid-cols-5 gap-4 items-end"><label className="block"><span className="text-xs text-slate-400">Stock symbol</span><select value={symbol} onChange={e => setSymbol(e.target.value)} className="mt-2 w-full rounded-xl px-3 py-3"><option>AAPL</option><option>MSFT</option><option>GOOGL</option><option>TSLA</option></select></label><label className="block"><span className="text-xs text-slate-400">Prediction horizon</span><select value={horizon} onChange={e => setHorizon(Number(e.target.value))} className="mt-2 w-full rounded-xl px-3 py-3"><option value="1">Next day</option><option value="5">Next 5 trading days</option><option value="30">Next 30 trading days</option></select></label><label className="block"><span className="text-xs text-slate-400">Training period</span><select value={years} onChange={e => setYears(Number(e.target.value))} className="mt-2 w-full rounded-xl px-3 py-3"><option value="1">1 year</option><option value="3">3 years</option><option value="5">5 years</option></select></label><label className="block lg:col-span-1"><span className="flex justify-between text-xs text-slate-400"><span>Lasso alpha</span><strong className="text-blue-300">{alpha.toFixed(2)}</strong></span><input type="range" min=".01" max="1" step=".01" value={alpha} onChange={e => setAlpha(Number(e.target.value))} className="mt-4 w-full accent-blue-500" /></label><button onClick={runPrediction} disabled={loading} className="rounded-xl bg-blue-500 px-4 py-3 font-bold disabled:opacity-60 hover:bg-blue-400 transition">{loading ? 'Training...' : 'Predict price'}</button></div>{error && <p className="mt-4 text-sm text-red-300">{error}</p>}<div className="mt-5 flex gap-2 text-xs text-slate-500"><span className="rounded-full border border-amber-400/20 bg-amber-400/10 px-3 py-1 text-amber-200">Demo Mode - Sample Historical Data</span><span className="hidden sm:inline py-1">No live market feed or financial advice</span></div></div></section>

          {data && <section className="max-w-7xl mx-auto px-5 pb-20"><div className="grid grid-cols-2 lg:grid-cols-4 gap-4"><Stat label="Latest available" value={money(data.latest)} note={data.symbol + ' · ' + data.period} /><Stat label="Daily change" value={`${money(data.change)} (${pct(data.change_pct)})`} tone={data.change >= 0 ? 'text-green-300' : 'text-red-300'} note="Compared with previous close" /><Stat label="Model estimate" value={money(data.predicted)} tone="text-blue-300" note={`${data.horizon} trading day horizon`} /><Stat label="Estimated difference" value={pct(data.prediction_change)} tone={data.prediction_change >= 0 ? 'text-green-300' : 'text-red-300'} note="Model output, not a guarantee" /></div><div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"><Stat label="Period high" value={money(data.high)} /><Stat label="Period low" value={money(data.low)} /><Stat label="Average close" value={money(data.average)} /><Stat label="Records" value={data.records.toLocaleString()} note="Cleaned observations" /></div></section>}

          {data && <section className="max-w-7xl mx-auto px-5 pb-20"><div className="grid lg:grid-cols-[1.4fr_.6fr] gap-5"><div className="card rounded-3xl p-5 md:p-7"><div className="flex flex-wrap gap-3 justify-between items-center mb-5"><div><p className="text-xs uppercase tracking-widest text-slate-500">Market history</p><h3 className="text-xl font-bold mt-1">Price movement</h3></div><div className="flex gap-2"><select value={field} onChange={e => setField(e.target.value)} className="rounded-lg px-2 py-2 text-xs"><option value="open">Open</option><option value="high">High</option><option value="low">Low</option><option value="close">Close</option><option value="adjusted_close">Adjusted close</option></select><select value={range} onChange={e => setRange(Number(e.target.value))} className="rounded-lg px-2 py-2 text-xs"><option value="30">30 days</option><option value="90">90 days</option><option value="180">Full view</option></select></div></div><div className="chart-wrap"><Chart type="line" data={historyChart} options={chartOptions} /></div></div><div className="card rounded-3xl p-5 md:p-7"><p className="text-xs uppercase tracking-widest text-slate-500">Model scorecard</p><h3 className="text-xl font-bold mt-1">Holdout performance</h3><div className="space-y-5 mt-8"><div><p className="text-sm text-slate-400">MAE</p><p className="text-3xl font-bold mt-1">{money(data.metrics.mae)}</p><p className="text-xs text-slate-500 mt-1">Average absolute difference.</p></div><div><p className="text-sm text-slate-400">RMSE</p><p className="text-3xl font-bold mt-1">{money(data.metrics.rmse)}</p><p className="text-xs text-slate-500 mt-1">Penalizes larger errors more.</p></div><div><p className="text-sm text-slate-400">R² score</p><p className="text-3xl font-bold mt-1 text-blue-300">{data.metrics.r2.toFixed(3)}</p><p className="text-xs text-slate-500 mt-1">Variation explained on holdout.</p></div></div></div></div></section>}

          {data && <section id="model" className="max-w-7xl mx-auto px-5 pb-20"><SectionTitle eyebrow="02 / Inside the model" title="What does Lasso consider important?" copy="L1 regularization can shrink coefficients exactly to zero. Those features are visually marked as removed, making the model easier to inspect." /><div className="grid lg:grid-cols-2 gap-5"><div className="card rounded-3xl p-5 md:p-7"><div className="chart-wrap"><Chart type="bar" data={coefficientChart} options={{...chartOptions, indexAxis: 'y', plugins: {...chartOptions.plugins, legend: {display: false}}, scales: {...chartOptions.scales, x: {...chartOptions.scales.x, ticks: {color: '#7183a0'}}, y: {...chartOptions.scales.y, ticks: {color: '#a9b8d0', font: {size: 11}}}}}} /></div><p className="text-xs text-amber-200 mt-4">Amber bars indicate “Feature removed by Lasso”.</p></div><div className="card rounded-3xl p-5 md:p-7"><div className="flex justify-between items-start"><div><p className="text-xs uppercase tracking-widest text-slate-500">Regularization dial</p><h3 className="text-xl font-bold mt-1">Alpha = {alpha.toFixed(2)}</h3></div><span className="text-xs rounded-full bg-blue-400/10 text-blue-300 px-2 py-1">{data.selected_features} selected</span></div><p className="text-slate-400 leading-7 mt-7">Lasso combines ordinary linear regression with an L1 penalty. A low alpha applies weaker regularization; a higher alpha applies stronger pressure and may remove too many features.</p><div className="mt-8 grid grid-cols-3 gap-3 text-xs"><div className="border-l-2 border-green-400 pl-3"><p className="text-slate-500">Low alpha</p><p className="mt-1">More features</p></div><div className="border-l-2 border-blue-400 pl-3"><p className="text-slate-500">Current</p><p className="mt-1">Balanced</p></div><div className="border-l-2 border-amber-400 pl-3"><p className="text-slate-500">High alpha</p><p className="mt-1">Sparse model</p></div></div></div></div></section>}

          {data && <section className="max-w-7xl mx-auto px-5 pb-20"><div className="card rounded-3xl p-5 md:p-7"><div className="flex flex-wrap justify-between items-end mb-5"><div><p className="text-xs uppercase tracking-widest text-slate-500">Holdout forecast</p><h3 className="text-xl font-bold mt-1">Actual vs predicted price</h3></div><span className="text-xs text-slate-500">Chronological test window</span></div><div className="chart-wrap"><Chart type="line" data={comparisonChart} options={chartOptions} /></div></div></section>}

          <section id="how" className="border-y border-slate-800/70 bg-[#0c1424] px-5 py-20"><div className="max-w-7xl mx-auto"><SectionTitle eyebrow="03 / How it works" title="From raw prices to a transparent estimate" copy="Each stage is intentionally visible so this mini-project can be explored, explained, and evaluated." /><div className="grid sm:grid-cols-2 lg:grid-cols-5 gap-3">{['Historical data', 'Data cleaning', 'Feature engineering', 'Chronological split', 'Feature scaling', 'Lasso regression', 'Feature selection', 'Prediction', 'Model evaluation'].map((step, index) => <div key={step} className="card rounded-2xl p-5"><span className="text-xs text-blue-400 font-bold">0{index + 1}</span><p className="font-bold mt-5">{step}</p><p className="text-xs leading-5 text-slate-500 mt-2">{['OHLCV observations', 'Remove incomplete rows', 'Returns, averages, volatility', 'Keep time order intact', 'Comparable feature scale', 'Fit the L1 model', 'Zero coefficients explain choices', 'Estimate selected horizon', 'MAE, RMSE and R²'][index]}</p></div>)}</div></div></section>

          <section id="about" className="max-w-7xl mx-auto px-5 py-20"><div className="grid lg:grid-cols-[1.1fr_.9fr] gap-14"><div><SectionTitle eyebrow="04 / About the project" title="A student-friendly look at feature selection" copy="StockSense AI demonstrates how Lasso Regression can help structure a stock-price modeling workflow while keeping its assumptions visible." /><div className="grid sm:grid-cols-2 gap-4"><div className="card rounded-2xl p-5"><p className="text-xs uppercase tracking-widest text-slate-500">Algorithm</p><p className="font-bold text-xl mt-3">Lasso Regression</p><p className="text-sm text-slate-400 mt-2">Linear prediction plus L1 regularization.</p></div><div className="card rounded-2xl p-5"><p className="text-xs uppercase tracking-widest text-slate-500">Toolkit</p><p className="font-bold text-xl mt-3">Python + React</p><p className="text-sm text-slate-400 mt-2">Flask, pandas, NumPy, scikit-learn and Chart.js.</p></div></div></div><div className="card rounded-3xl p-6 md:p-8"><p className="text-xs uppercase tracking-widest text-blue-400">Linear vs Lasso</p><div className="mt-6 space-y-3 text-sm"><div className="grid grid-cols-3 gap-3 text-slate-500 pb-2 border-b border-slate-700"><span>Property</span><span>Linear</span><span>Lasso</span></div>{[['Regularization', 'None', 'L1'], ['Feature selection', 'No', 'Yes'], ['Zero coefficients', 'No', 'Yes'], ['Many features', 'Moderate', 'Useful']].map(row => <div className="grid grid-cols-3 gap-3 py-2 border-b border-slate-800" key={row[0]}><span className="text-slate-300">{row[0]}</span><span className="text-slate-500">{row[1]}</span><span className="text-blue-300">{row[2]}</span></div>)}</div></div></div></section>

          <section className="max-w-7xl mx-auto px-5 pb-20"><div className="rounded-3xl border border-amber-400/20 bg-amber-400/5 p-6 md:p-8"><p className="text-xs uppercase tracking-widest text-amber-300 font-bold">Important limitation</p><p className="text-slate-300 leading-7 mt-3 max-w-4xl">This project is for educational and demonstration purposes only. Stock-price predictions are estimates generated by a machine-learning model and are not guaranteed. This application does not provide financial advice or recommendations. Market prices are affected by many unpredictable factors that a simple regression model cannot reliably capture.</p><div className="no-print flex flex-wrap gap-3 mt-6"><button onClick={() => window.print()} className="rounded-xl bg-slate-100 text-slate-900 px-5 py-3 font-bold hover:bg-white transition">Download / print report</button><button onClick={scrollRun} className="rounded-xl border border-slate-600 px-5 py-3 font-bold hover:border-slate-400 transition">Run another prediction</button></div></div></section>
        </main><footer className="border-t border-slate-800 px-5 py-8 text-center text-xs text-slate-500">StockSense AI · Lasso Regression educational lab · Demo mode uses deterministic sample historical data.</footer>
      </>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
